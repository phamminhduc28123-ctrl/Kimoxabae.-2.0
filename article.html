<!doctype html>
<html lang="en">
<head>
	<link rel="icon" type="image/svg+xml" href="Kimoxabae%20Favicon.svg">
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title id="page-title">Blog</title>

	<script src="https://cdn.tailwindcss.com"></script>
	<style id="shared-styles"></style>
</head>

<body class="min-h-screen">
	<div id="shared-header"></div>

	<!-- Hero: thumbnail with the title overlaid -->
	<header class="relative w-full h-[45vh] md:h-[55vh] mt-16 bg-black">
		<div id="hero-parallax" class="absolute inset-0 will-change-transform">
			<img id="article-hero-img" src="" alt="" class="absolute inset-0 w-full h-full object-cover opacity-90">
			<div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/30 to-black/10"></div>
			<div class="absolute inset-0 flex items-end p-6 md:p-12">
				<div class="max-w-4xl">
					<h1 id="article-title" class="font-lexend text-3xl md:text-5xl font-medium uppercase tracking-wider text-white drop-shadow-lg"></h1>
				</div>
			</div>
		</div>
	</header>

	<main class="relative z-10 bg-white px-0 py-12">
		<div id="article-body" class="w-full md:w-1/2 mx-auto">
			<!-- Article content will be injected here -->
		</div>
	</main>

	<!-- Impressum Footer -->
	<footer id="footer" class="w-full mt-12 py-8 px-4 bg-white border-t border-gray-100">
		<div class="max-w-2xl mx-auto text-center space-y-1 text-xs">
			<h3 class="text-base font-bold uppercase mb-4 tracking-widest">Impressum</h3>
			<p class="text-black font-medium">Name: Minh Đức Phạm</p>
			<p class="text-black">Address: Nuremberg, Germany</p>
			<p class="text-black">Email: <a href="mailto:kimoxabae@web.de" class="hover:underline">kimoxabae@web.de</a></p>
			<p class="text-[0.65rem] text-gray-500 mt-6 pt-4 max-w-md mx-auto">
				This is a personal portfolio website. All artwork and content are created by the artist and may not be used without permission.
			</p>
		</div>
	</footer>

	<script>
		// Article list is generated by scripts/generate_blog_manifest.py from the contents of /blog
		let articles = [];

		async function loadManifest() {
			try {
				const response = await fetch('blog/manifest.json', { cache: 'no-store' });
				if (!response.ok) throw new Error(`Could not load manifest (${response.status})`);
				articles = await response.json();
			} catch (e) {
				console.error('Could not load blog manifest:', e);
				articles = [];
			}
		}

		function renderArticleBody(sourceDocument, articleFile) {
			const container = document.getElementById('article-body');
			container.innerHTML = '';

			const firstHeading = Array.from(sourceDocument.body.children)
				.find(node => /^H[1-3]$/.test(node.tagName));
			firstHeading?.remove();

			sourceDocument.querySelectorAll('script, base, link[rel="stylesheet"]')
				.forEach(node => node.remove());

			sourceDocument.head.querySelectorAll('style').forEach(style => {
				style.textContent = style.textContent.replace(
					/@import\s+(?:url\([^)]*\)|["'][^"']*["'])\s*[^;]*;/gi,
					''
				);
			});

			const base = sourceDocument.createElement('base');
			base.href = new URL(articleFile, window.location.href).href;
			sourceDocument.head.prepend(base);

			const siteFont = sourceDocument.createElement('style');
			const fontUrl = new URL('fonts/Geom-VariableFont_wght.woff2', window.location.href).href;
			siteFont.textContent = `
				html, body { overflow-y: hidden !important; }
				/* Drop the Google Docs page width/margins so the text fills the container */
				body { max-width: none !important; margin: 0 !important; padding: 0 !important; }
				p, h1, h2, h3, h4, h5, h6, li { margin-left: 0 !important; margin-right: 0 !important; }
				@font-face {
					font-family: 'Geom Variable';
					src: url("${fontUrl}") format("woff2");
					font-weight: 100 900;
					font-display: swap;
				}
				* { font-family: 'Geom Variable', sans-serif !important; }
			`;
			sourceDocument.head.appendChild(siteFont);

			const frame = document.createElement('iframe');
			frame.title = 'Article content';
			frame.className = 'block w-full border-0';
			frame.setAttribute('sandbox', 'allow-same-origin allow-popups');
			frame.setAttribute('scrolling', 'no');
			frame.style.height = '1px';
			frame.addEventListener('load', () => {
				const frameDocument = frame.contentDocument;
				if (!frameDocument) return;

				const textElements = [frameDocument.body, ...frameDocument.body.querySelectorAll('*')]
					.filter(element => element.textContent.trim());
				const originalFontSizes = textElements.map(element =>
					parseFloat(frameDocument.defaultView.getComputedStyle(element).fontSize)
				);
				textElements.forEach((element, index) => {
					element.style.setProperty('font-size', `${originalFontSizes[index] * 2}px`, 'important');
				});

				const updateHeight = () => {
					const body = frameDocument.body;
					const bodyStyle = frameDocument.defaultView.getComputedStyle(body);
					const bodyHeight = Math.max(body.scrollHeight, body.getBoundingClientRect().height);
					const bodyMargins =
						parseFloat(bodyStyle.marginTop) + parseFloat(bodyStyle.marginBottom);
					const root = frameDocument.documentElement;
					const contentHeight = root.scrollHeight > root.clientHeight
						? root.scrollHeight
						: bodyHeight + bodyMargins;
					const height = `${Math.ceil(contentHeight + 2)}px`;

					if (frame.style.height !== height) {
						frame.style.height = height;
					}
				};

				updateHeight();
				const observer = new ResizeObserver(updateHeight);
				observer.observe(frameDocument.documentElement);
				observer.observe(frameDocument.body);
				frame.contentWindow.addEventListener('resize', updateHeight);
				frameDocument.querySelectorAll('img').forEach(image => {
					image.addEventListener('load', updateHeight);
					image.addEventListener('error', updateHeight);
				});
				frameDocument.fonts?.ready.then(updateHeight);
			});
			frame.srcdoc = `<!doctype html>${sourceDocument.documentElement.outerHTML}`;
			container.appendChild(frame);
		}

		async function initArticle() {
			await loadManifest();

			const params = new URLSearchParams(window.location.search);
			const slug = params.get('post');
			const article = articles.find(a => a.slug === slug);

			if (!article) {
				window.location.href = 'blog.html';
				return;
			}

			document.getElementById('page-title').textContent = article.title;
			document.getElementById('article-title').textContent = article.title;
			document.getElementById('article-hero-img').src = article.thumbnail;
			document.getElementById('article-hero-img').alt = article.title;

			try {
				const response = await fetch(article.file);
				const html = await response.text();
				const sourceDocument = new DOMParser().parseFromString(html, 'text/html');
				renderArticleBody(sourceDocument, article.file);
			} catch (e) {
				console.error('Article load failed:', e);
			}
		}

		// Hero moves at half the scroll speed; the white text section slides over it
		const heroParallax = document.getElementById('hero-parallax');
		const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
		let parallaxTicking = false;

		function updateParallax() {
			parallaxTicking = false;
			if (reduceMotion.matches) return;
			heroParallax.style.transform = `translate3d(0, ${Math.max(0, window.scrollY) * 0.5}px, 0)`;
		}

		window.addEventListener('scroll', () => {
			if (parallaxTicking) return;
			parallaxTicking = true;
			requestAnimationFrame(updateParallax);
		}, { passive: true });
		updateParallax();

		initArticle();

		fetch('./index.html')
			.then(response => {
				if (!response.ok) {
					throw new Error('Could not load index.html');
				}

				return response.text();
			})
			.then(html => {
				const sourceDocument =
					new DOMParser().parseFromString(html, 'text/html');

				const sourceStyle =
					sourceDocument.querySelector('style');

				if (sourceStyle) {
					document.getElementById('shared-styles').textContent =
						sourceStyle.textContent;
				}

				const sourceHeader =
					sourceDocument.querySelector('#smartHeader');

				if (sourceHeader) {
					document
						.getElementById('shared-header')
						.appendChild(document.importNode(sourceHeader, true));
				}

				const sourceScripts =
					sourceDocument.querySelectorAll('script:not([src])');

				sourceScripts.forEach(sourceScript => {
					const script = document.createElement('script');
					script.textContent = sourceScript.textContent;
					document.body.appendChild(script);
				});

				document.dispatchEvent(new Event('DOMContentLoaded'));
			})
			.catch(error => {
				console.error('Article page error:', error);
			});
	</script>
</body>
</html>

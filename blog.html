<!doctype html>
<html lang="en">
<head>
	<link rel="icon" type="image/svg+xml" href="Kimoxabae%20Favicon.svg">
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Blog</title>

	<script src="https://cdn.tailwindcss.com"></script>
	<style id="shared-styles"></style>
	<style id="blog-styles">
		@keyframes title-blink {
			0% { opacity: 1; }
			50% { opacity: 0; }
			100% { opacity: 1; }
		}
		.title-blink {
			animation: title-blink 0.6s ease-in-out;
		}
	</style>
</head>

<body class="min-h-screen">
	<div id="shared-header"></div>

	<main class="pt-16 pb-16">
		<div class="group relative w-full h-56 md:h-72 overflow-hidden mb-10">
				<img src="blog/Thumbnail/Blog Header.png" alt=""
					class="absolute inset-0 w-full h-full object-cover grayscale group-hover:grayscale-0 transition-all duration-700">
				<div class="absolute inset-0 bg-black/40"></div>
				<div class="absolute inset-0 flex items-center px-6 md:px-12">
					<h1 class="font-lexend text-4xl md:text-6xl font-medium tracking-wider text-white uppercase transition-all duration-500 ease-out group-hover:opacity-0 group-hover:-translate-x-10">Blog</h1>
				</div>
			</div>

		<div class="max-w-5xl mx-auto px-4 md:px-8">
			<div class="flex flex-col sm:flex-row gap-4 sm:items-center sm:justify-between mb-10">
				<input id="blog-search" type="text" placeholder="Search articles and their text..."
					class="w-full sm:max-w-xs px-4 py-2 border border-gray-200 rounded-full text-sm focus:outline-none focus:ring-1 focus:ring-black">

				<div class="relative w-full sm:w-auto">
					<select id="blog-sort" class="appearance-none w-full sm:w-auto pl-4 pr-9 py-2 border border-gray-200 rounded-full text-sm focus:outline-none focus:ring-1 focus:ring-black">
						<option value="desc">Newest first</option>
						<option value="asc">Oldest first</option>
					</select>
					<svg class="pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 w-3 h-3 text-gray-500" viewBox="0 0 12 12" fill="none">
						<path d="M2.5 4.5L6 8L9.5 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
					</svg>
				</div>
			</div>

			<div id="blog-grid" class="flex flex-col gap-6">
				<!-- Articles will be injected here -->
			</div>

			<p id="blog-empty" class="hidden text-sm text-gray-500 mt-6">No articles match your search.</p>
		</div>
	</main>

	<!-- Impressum Footer -->
	<footer id="footer" class="w-full mt-12 py-8 px-4 bg-white border-t border-gray-100">
		<div class="max-w-2xl mx-auto text-center space-y-1 text-xs">
			<h3 class="text-base font-bold uppercase mb-4 tracking-widest">Impressum</h3>
			<p class="text-black font-medium">Name: Minh Đức Phạm</p>
			<p class="text-black">Address: Nuremberg, Germany</p>
			<p class="text-black">Email: <a href="mailto:kimoxabae@web.de" class="hover:underline">kimoxabae@web.de</a></p>
			<p class="text-[0.65rem] text-gray-500 mt-6 pt-4 max-w-md mx-auto">
				This is a personal portfolio website. All artwork and content are created by the artist and may not be used without permission.
			</p>
		</div>
	</footer>

	<script>
		const grid = document.getElementById('blog-grid');
		const emptyMessage = document.getElementById('blog-empty');
		const searchInput = document.getElementById('blog-search');
		const sortSelect = document.getElementById('blog-sort');

		// Article list is generated by scripts/generate_blog_manifest.py from the contents of /blog
		let articles = [];

		function formatDate(dateString) {
			if (!dateString) return 'Unknown date';
			const date = new Date(dateString);
			const datePart = date.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
			const timePart = date.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
			return `${datePart} · ${timePart}`;
		}

		async function loadManifest() {
			try {
				const response = await fetch('blog/manifest.json', { cache: 'no-store' });
				if (!response.ok) throw new Error(`Could not load manifest (${response.status})`);

				const data = await response.json();
				articles = data.map(article => ({ ...article, contentText: '' }));
			} catch (e) {
				console.error('Could not load blog manifest:', e);
				articles = [];
			}
		}

		// Fetches the article's own text so the search box can match against its full content
		async function loadArticleContent(article) {
			try {
				const response = await fetch(article.file);
				const html = await response.text();
				const sourceDocument = new DOMParser().parseFromString(html, 'text/html');
				article.contentText = (sourceDocument.body.textContent || '').toLowerCase();
			} catch (e) {
				console.error('Could not load article content for search', article.file, e);
				article.contentText = '';
			}
		}

		function getVisibleArticles() {
			const keyword = searchInput.value.trim().toLowerCase();

			return articles
				.filter(article =>
					!keyword ||
					article.title.toLowerCase().includes(keyword) ||
					article.subtitle.toLowerCase().includes(keyword) ||
					article.contentText.includes(keyword))
				.sort((a, b) => {
					const diff = new Date(a.date || 0) - new Date(b.date || 0);
					return sortSelect.value === 'asc' ? diff : -diff;
				});
		}

		function renderArticles() {
			grid.innerHTML = '';
			const visibleArticles = getVisibleArticles();
			emptyMessage.classList.toggle('hidden', visibleArticles.length > 0);

			visibleArticles.forEach(article => {
				const card = document.createElement('a');
				card.href = `article.html?post=${encodeURIComponent(article.slug)}`;
				card.className = 'relative flex h-40 md:h-56 overflow-hidden rounded-lg bg-gray-50 cursor-pointer';

				card.innerHTML = `
					<div class="blog-card-image w-1/2 h-full flex-shrink-0 overflow-hidden transition-[width] duration-500 ease-out">
						<img src="${article.thumbnail}" alt="${article.title}" loading="lazy"
							class="blog-card-img w-full h-full object-cover grayscale transition-all duration-700">
					</div>
					<div class="blog-card-text w-1/2 h-full relative flex flex-col justify-center p-6 md:p-8 transition-[width] duration-500 ease-out">
						<h2 class="blog-card-title font-lexend text-black text-base md:text-xl font-medium uppercase tracking-wider">${article.title}</h2>
						<p class="blog-card-subtitle text-gray-600 text-sm mt-1 font-light transition-opacity duration-300">${article.subtitle}</p>
						<span class="blog-card-date absolute bottom-3 right-4 text-[0.7rem] text-gray-400 transition-opacity duration-300">${formatDate(article.date)}</span>
					</div>
				`;

				// Only hovering the thumbnail (left half) expands it; the title/text half doesn't trigger it
				const imageWrapper = card.querySelector('.blog-card-image');
				const image = card.querySelector('.blog-card-img');
				const textWrapper = card.querySelector('.blog-card-text');
				const title = card.querySelector('.blog-card-title');
				const subtitle = card.querySelector('.blog-card-subtitle');
				const date = card.querySelector('.blog-card-date');

				function setExpanded(expanded) {
					imageWrapper.classList.toggle('w-1/2', !expanded);
					imageWrapper.classList.toggle('w-3/5', expanded);
					textWrapper.classList.toggle('w-1/2', !expanded);
					textWrapper.classList.toggle('w-2/5', expanded);
					image.classList.toggle('grayscale', !expanded);
					image.classList.toggle('scale-105', expanded);

					if (expanded) {
						subtitle.classList.add('opacity-0');
						date.classList.add('opacity-0');
					} else {
						setTimeout(() => {
							subtitle.classList.remove('opacity-0');
							date.classList.remove('opacity-0');
						}, 500);
					}

					title.classList.remove('title-blink');
					void title.offsetWidth;
					title.classList.add('title-blink');
				}

				imageWrapper.addEventListener('mouseenter', () => setExpanded(true));
				imageWrapper.addEventListener('mouseleave', () => setExpanded(false));
				title.addEventListener('animationend', () => title.classList.remove('title-blink'));

				grid.appendChild(card);
			});
		}

		searchInput.addEventListener('input', renderArticles);
		sortSelect.addEventListener('change', renderArticles);

		async function initBlog() {
			await loadManifest();
			renderArticles();

			await Promise.all(articles.map(loadArticleContent));

			renderArticles();
		}

		initBlog();

		fetch('./index.html')
			.then(response => {
				if (!response.ok) {
					throw new Error('Could not load index.html');
				}

				return response.text();
			})
			.then(html => {
				const sourceDocument =
					new DOMParser().parseFromString(html, 'text/html');

				const sourceStyle =
					sourceDocument.querySelector('style');

				if (sourceStyle) {
					document.getElementById('shared-styles').textContent =
						sourceStyle.textContent;
				}

				const sourceHeader =
					sourceDocument.querySelector('#smartHeader');

				if (sourceHeader) {
					document
						.getElementById('shared-header')
						.appendChild(document.importNode(sourceHeader, true));
				}

				const sourceScripts =
					sourceDocument.querySelectorAll('script:not([src])');

				sourceScripts.forEach(sourceScript => {
					const script = document.createElement('script');
					script.textContent = sourceScript.textContent;
					document.body.appendChild(script);
				});

				document.dispatchEvent(new Event('DOMContentLoaded'));
			})
			.catch(error => {
				console.error('Blog page error:', error);
			});
	</script>
</body>
</html>

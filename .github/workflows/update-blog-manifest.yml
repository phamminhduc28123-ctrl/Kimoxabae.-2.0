name: Update content manifests

on:
  push:
    branches: [main]
    paths:
      - 'blog/**'
      - 'scripts/generate_blog_manifest.py'
      - 'illu/**'
      - 'illu legacy/**'
      - '!illu/preview/**'
      - '!illu legacy/preview/**'
      - 'scripts/generate_illustration_manifest.py'
      - 'scripts/process_illustrations.py'
      - 'scripts/requirements-image-processing.txt'
      - '.github/workflows/update-blog-manifest.yml'
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-content-manifests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image processing dependency
        run: python -m pip install -r scripts/requirements-image-processing.txt

      - name: Generate blog manifest
        run: python3 scripts/generate_blog_manifest.py

      - name: Process illustration previews and legacy transitions
        run: python -m scripts.process_illustrations

      - name: Generate illustration manifest
        run: python3 scripts/generate_illustration_manifest.py

      - name: Commit generated content if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add blog/manifest.json illu/ 'illu legacy/'
          git diff --cached --quiet || git commit -m "chore: update content manifests"
          git push

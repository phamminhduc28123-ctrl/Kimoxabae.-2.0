name: Update content manifests

on:
  push:
    branches: [main]
    paths:
      - 'blog/**'
      - 'scripts/generate_blog_manifest.py'
      - 'illu/*.jpg'
      - 'illu/*.jpeg'
      - 'illu/*.png'
      - 'illu/*.webp'
      - 'illu/*.gif'
      - 'illu/descriptions.txt'
      - 'illu legacy/**'
      - 'scripts/generate_illustration_manifest.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate blog manifest
        run: python3 scripts/generate_blog_manifest.py

      - name: Generate illustration manifest
        run: python3 scripts/generate_illustration_manifest.py

      - name: Commit manifests if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add blog/manifest.json illu/manifest.json
          git diff --cached --quiet || git commit -m "chore: update content manifests"
          git push

<!doctype html>
<html lang="en">
<head>
    <link rel="icon" type="image/svg+xml" href="Kimoxabae%20Favicon.svg">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4f0e9">
    <title>Illustration — Kimoxabae</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <style id="shared-styles"></style>
    <style>
        #shared-header #smartHeader { background-color: #000 !important; }
        #hero { display: flex; min-height: 100vh; padding-top: 4rem; background: #000; color: #fff; }
        #hero-image-area { width: 50%; display: flex; align-items: center; justify-content: center; padding: 2rem; cursor: pointer; }
        #hero-img { max-width: 100%; max-height: calc(100vh - 8rem); object-fit: contain; transition: opacity .5s ease; }
        #hero-text { width: 50%; display: flex; flex-direction: column; justify-content: center; padding: 3rem; transition: opacity .5s ease; }
        .fade-out { opacity: 0 !important; }
        #wall { position: relative; width: 100%; }
        #legacy { position: relative; }
        #legacy::before, #legacy::after {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            height: 10%;
            pointer-events: none;
            z-index: 2;
        }
        #legacy::before {
            top: 0;
            background: linear-gradient(to bottom, #fff 0%, transparent 100%);
        }
        #legacy::after {
            bottom: 0;
            background: linear-gradient(to top, #fff 0%, transparent 100%);
        }
        @media (max-width: 767px) {
            #hero { flex-direction: column; min-height: 0; padding-bottom: 1rem; }
            #hero-image-area, #hero-text { width: 100%; }
            #hero-text { padding: 1.5rem 2rem 2.5rem; }
        }
        #wall-blur { position: absolute; inset: 0; pointer-events: none; }
        #wall-blur-soft { position: absolute; inset: 0; pointer-events: none; z-index: 1; }
        .blur-item { position: absolute; filter: grayscale(1); opacity: .85;
            -webkit-mask-image: radial-gradient(closest-side, #000 72%, transparent 100%);
            mask-image: radial-gradient(closest-side, #000 72%, transparent 100%); }
        .blur-item-soft { position: absolute; filter: grayscale(1) blur(20px); opacity: .2;
            -webkit-mask-image: radial-gradient(closest-side, #000 72%, transparent 100%);
            mask-image: radial-gradient(closest-side, #000 72%, transparent 100%); }
        .blur-item img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
        .blur-item .b-low { filter: blur(3px); }
        .blur-item .b-high { filter: blur(28px);
            -webkit-mask-image: radial-gradient(closest-side, transparent 15%, #000 85%);
            mask-image: radial-gradient(closest-side, transparent 15%, #000 85%); }
        .wall-item { position: absolute; cursor: pointer; transition: transform .6s ease, filter .6s ease; filter: grayscale(1); z-index: 3;
            -webkit-mask-image: radial-gradient(closest-side, #000 72%, transparent 100%);
            mask-image: radial-gradient(closest-side, #000 72%, transparent 100%); }
        .wall-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .wall-item:hover { transform: scale(1.3); filter: grayscale(0); z-index: 5; }
        #lightbox-img { transition: all 1s ease-out; }
    </style>
</head>

<body class="min-h-screen flex flex-col">
    <div id="shared-header"></div>

    <main class="flex-grow">
        <section id="hero" class="hidden">
            <div id="hero-image-area"><img id="hero-img" src="" alt=""></div>
            <div id="hero-text">
                <p id="hero-caption" class="text-lg md:text-xl leading-relaxed font-light"></p>
                <p id="hero-date" class="mt-6 text-xs uppercase tracking-[0.2em] text-gray-400"></p>
            </div>
        </section>
        <section id="legacy" class="bg-white px-4 md:px-8 py-16 overflow-hidden">
            <div id="wall"><div id="wall-blur"></div></div>
        </section>
    </main>

    <div id="lightbox" class="fixed inset-0 bg-black/95 z-[100] hidden flex flex-col md:flex-row items-center justify-center cursor-default opacity-0 transition-opacity duration-300">
        <button id="close-lightbox" class="absolute top-6 right-8 text-white text-4xl font-light hover:scale-110 transition-transform z-[110] cursor-pointer">&times;</button>
        <div id="lightbox-image-area" class="flex-1 relative flex items-center justify-center p-4 h-[60vh] md:h-full overflow-hidden cursor-pointer">
            <img id="lightbox-img" src="" alt="Illustration" class="max-w-full max-h-full object-contain opacity-0 translate-y-8">
        </div>
        <div class="w-full md:w-96 h-[40vh] md:h-full bg-black text-white p-8 md:p-12 flex flex-col justify-center border-t md:border-t-0 md:border-l border-white/10 overflow-y-auto">
            <p id="lightbox-caption" class="text-sm text-gray-400 leading-relaxed font-light"></p>
            <p id="lightbox-date" class="mt-6 text-xs uppercase tracking-[0.2em] text-gray-500"></p>
        </div>
    </div>


    <footer id="footer" class="w-full mt-6 py-5 px-4 bg-white">
        <div class="max-w-2xl mx-auto text-center space-y-0.5 text-xs">
            <h3 class="text-base font-bold uppercase mb-3 tracking-widest">Impressum</h3>
            <p class="text-black font-medium">Name: Minh Đức Phạm</p>
            <p class="text-black">Address: Nuremberg, Germany</p>
            <p class="text-black">Email: <a href="mailto:kimoxabae@web.de" class="hover:underline">kimoxabae@web.de</a></p>
            <p class="text-[0.65rem] text-gray-500 mt-4 pt-2 border-t border-gray-200 max-w-md mx-auto">
                This is a personal portfolio website. All artwork and content are created by the artist and may not be used without permission.
            </p>
        </div>
    </footer>

    <script>
        (async function () {
            const DAY = 86400000;
            const fmt = d => new Date(d).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
            const src = e => encodeURI(e.file);

            let items = [];
            try {
                items = await (await fetch('illu/manifest.json')).json();
            } catch (e) {
                console.error('Illustration manifest error:', e);
                return;
            }

            items.sort((a, b) =>
                (b.date > a.date ? 1 : b.date < a.date ? -1 : 0) ||
                (a.legacy - b.legacy) || (a.order - b.order));

            const now = Date.now();
            let hero = items.filter(i => !i.legacy && now - new Date(i.date).getTime() <= 30 * DAY);
            if (!hero.length) hero = items.slice(0, 5);
            const wallItems = items.filter(i => !hero.includes(i));

            // Hero
            const lightbox = document.getElementById('lightbox');
            const heroEl = document.getElementById('hero');
            const heroArea = document.getElementById('hero-image-area');
            const heroImg = document.getElementById('hero-img');
            const heroText = document.getElementById('hero-text');
            const heroCaption = document.getElementById('hero-caption');
            const heroDate = document.getElementById('hero-date');
            let heroIndex = 0, heroBusy = false;

            function fill(i) {
                const it = hero[i];
                heroImg.src = src(it);
                heroImg.alt = it.description || 'Illustration';
                heroCaption.textContent = it.description;
                heroDate.textContent = it.legacy ? '' : fmt(it.date);
            }
            function heroGo(i) {
                if (heroBusy || hero.length < 2) return;
                heroBusy = true;
                heroImg.classList.add('fade-out');
                heroText.classList.add('fade-out');
                setTimeout(() => {
                    heroIndex = (i + hero.length) % hero.length;
                    fill(heroIndex);
                    heroImg.onload = heroImg.onerror = () => {
                        heroImg.classList.remove('fade-out');
                        heroText.classList.remove('fade-out');
                        heroBusy = false;
                    };
                }, 500);
            }
            if (hero.length) {
                heroEl.classList.remove('hidden');
                fill(0);
                heroArea.addEventListener('click', e => {
                    const r = heroArea.getBoundingClientRect();
                    heroGo(heroIndex + (e.clientX - r.left < r.width / 2 ? -1 : 1));
                });
                heroEl.addEventListener('click', e => {
                    if (heroArea.contains(e.target)) return;
                    heroGo(heroIndex + 1);
                });
                document.addEventListener('keydown', e => {
                    if (!lightbox.classList.contains('hidden')) return;
                    if (e.key === 'ArrowRight') heroGo(heroIndex + 1);
                    if (e.key === 'ArrowLeft') heroGo(heroIndex - 1);
                });
            }

            // Wall
            const wall = document.getElementById('wall');
            function layoutWall() {
                wall.innerHTML = '<div id="wall-blur"></div><div id="wall-blur-soft"></div>';
                const blurLayer = wall.firstChild;
                const softBlurLayer = wall.children[1];
                const W = wall.clientWidth;
                const base = Math.max(90, Math.min(190, W / 6));
                const placed = [];
                const overlap = 0.02;
                wallItems.forEach((it, idx) => {
                    const d = base * (0.8 + Math.random() * 0.4);
                    const r = d / 2;
                    let best = null;
                    for (let t = 0; t < 120; t++) {
                        const x = r + Math.random() * Math.max(1, W - 2 * r);
                        let y = r;
                        for (const p of placed) {
                            const min = r + p.r - overlap * Math.min(r, p.r) * 2;
                            const dx = x - p.x;
                            if (Math.abs(dx) < min) y = Math.max(y, p.y + Math.sqrt(min * min - dx * dx));
                        }
                        if (!best || y < best.y) best = { x, y };
                    }
                    placed.push({ x: best.x, y: best.y, r, idx });
                });
                const size = 1.2;
                let H = 0;
                placed.forEach(p => {
                    const it = wallItems[p.idx];
                    const el = document.createElement('div');
                    el.className = 'wall-item';
                    const s = p.r * 2 * size;
                    el.style.cssText = `width:${s}px;height:${s}px;left:${p.x - s / 2}px;top:${p.y - s / 2}px`;
                    const img = document.createElement('img');
                    img.src = src(it);
                    img.alt = it.description || 'Illustration';
                    img.loading = 'lazy';
                    el.appendChild(img);
                    el.addEventListener('click', () => openLightbox(p.idx));
                    wall.appendChild(el);
                    const bs = s * 2;
                    const bel = document.createElement('div');
                    bel.className = 'blur-item';
                    bel.style.cssText = `width:${bs}px;height:${bs}px;left:${p.x - bs / 2}px;top:${p.y - bs / 2}px`;
                    ['b-low', 'b-high'].forEach(cls => {
                        const bimg = document.createElement('img');
                        bimg.className = cls;
                        bimg.src = src(it);
                        bimg.alt = '';
                        bimg.loading = 'lazy';
                        bel.appendChild(bimg);
                    });
                    blurLayer.appendChild(bel);
                    const softBel = document.createElement('div');
                    softBel.className = 'blur-item-soft';
                    softBel.style.cssText = `width:${bs}px;height:${bs}px;left:${p.x - bs / 2}px;top:${p.y - bs / 2}px`;
                    const softImg = document.createElement('img');
                    softImg.src = src(it);
                    softImg.alt = '';
                    softImg.loading = 'lazy';
                    softBel.appendChild(softImg);
                    softBlurLayer.appendChild(softBel);
                    H = Math.max(H, p.y + p.r);
                });
                wall.style.height = H + 'px';
            }
            layoutWall();
            let lastW = wall.clientWidth, rt;
            window.addEventListener('resize', () => {
                clearTimeout(rt);
                rt = setTimeout(() => {
                    if (wall.clientWidth !== lastW) { lastW = wall.clientWidth; layoutWall(); }
                }, 250);
            });

            // Lightbox (same behaviour as photography.html)
            let current = 0;
            const lightboxArea = document.getElementById('lightbox-image-area');
            const lightboxImg = document.getElementById('lightbox-img');
            function show(i) {
                if (!wallItems.length) return;
                current = (i + wallItems.length) % wallItems.length;
                const it = wallItems[current];
                lightboxImg.src = src(it);
                document.getElementById('lightbox-caption').textContent = it.description;
                document.getElementById('lightbox-date').textContent = it.legacy ? '' : fmt(it.date);
            }
            function openLightbox(i) {
                show(i);
                lightbox.classList.remove('hidden');
                document.body.style.overflow = 'hidden';
                void lightbox.offsetWidth;
                lightbox.classList.remove('opacity-0');
                lightboxImg.classList.remove('opacity-0', 'translate-y-8');
            }
            function closeBox() {
                lightbox.classList.add('opacity-0');
                lightboxImg.classList.add('opacity-0', 'translate-y-8');
                setTimeout(() => {
                    lightbox.classList.add('hidden');
                    document.body.style.overflow = '';
                }, 1000);
            }
            document.getElementById('close-lightbox').addEventListener('click', closeBox);
            lightboxImg.addEventListener('click', closeBox);
            lightbox.addEventListener('click', e => { if (e.target === lightbox) closeBox(); });
            lightboxArea.addEventListener('click', e => {
                if (e.target !== lightboxArea) return;
                const r = lightboxArea.getBoundingClientRect();
                show(current + (e.clientX - r.left < r.width / 2 ? -1 : 1));
            });
            document.addEventListener('keydown', e => {
                if (lightbox.classList.contains('hidden')) return;
                if (e.key === 'ArrowRight') show(current + 1);
                else if (e.key === 'ArrowLeft') show(current - 1);
                else if (e.key === 'Escape') closeBox();
            });
        })();
    </script>

    <script>
        fetch('./index.html')
            .then(response => {
                if (!response.ok) {
                    throw new Error('Could not load index.html');
                }

                return response.text();
            })
            .then(html => {
                const sourceDocument = new DOMParser().parseFromString(html, 'text/html');
                const sourceStyle = sourceDocument.querySelector('style');

                if (sourceStyle) {
                    document.getElementById('shared-styles').textContent = sourceStyle.textContent;
                }

                const sourceHeader = sourceDocument.querySelector('#smartHeader');
                if (sourceHeader) {
                    document
                        .getElementById('shared-header')
                        .appendChild(document.importNode(sourceHeader, true));
                }

                sourceDocument.querySelectorAll('script:not([src])').forEach(sourceScript => {
                    const script = document.createElement('script');
                    script.textContent = sourceScript.textContent;
                    document.body.appendChild(script);
                });

                document.dispatchEvent(new Event('DOMContentLoaded'));
            })
            .catch(error => {
                console.error('Illustration page header error:', error);
            });
    </script>
</body>
</html>
